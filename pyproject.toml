[project]
name = "invoice-automation"
version = "0.1.0"
description = "Invoice processing and exception reporting - synthetic portfolio project"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: requires a live PostgreSQL database (see docs/setup.md)",
]
addopts = "-ra"
